name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Vet the e2e build (recordings)
        run: go vet -tags e2e ./cmd/...
      - run: go test -race -count=1 ./...

  scripts:
    name: Installer and release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: shellcheck -s sh install.sh
      - run: shellcheck scripts/*.sh
      - name: Release notes render
        run: scripts/release-notes.sh v0.0.0-ci
